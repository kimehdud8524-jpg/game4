<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LOG</title>
    <style>
        body {
            margin: 0;
            background-color: #08080a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 92vh;
            overflow: hidden;
            user-select: none;
        }

        /* ================= 타이틀 화면 스타일 ================= */
        #title-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #11141d 0%, #050507 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.6s ease;
        }
        .title-logo {
            font-size: 96px;
            font-weight: bold;
            letter-spacing: 24px;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.6), -3px 0 #ff4757, 3px 0 #00a8ff;
            margin-bottom: 10px;
            padding-left: 24px;
            animation: glitchSkew 3s infinite alternate;
        }
        .title-sub {
            font-size: 14px;
            color: #7f8fa6;
            letter-spacing: 4px;
            margin-bottom: 50px;
        }
        #start-btn {
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            transition: all 0.25s ease;
        }
        #start-btn:hover {
            background: #00ffcc;
            color: #08080a;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.8);
            transform: scale(1.05);
        }
        .title-footer {
            position: absolute;
            bottom: 30px;
            font-size: 12px;
            color: #444;
        }

        @keyframes glitchSkew {
            0%, 90%, 100% { transform: skew(0deg); }
            92% { transform: skew(-4deg); }
            94% { transform: skew(4deg); }
            96% { transform: skew(-2deg); }
        }

        /* ================= 본 게임 UI 스타일 ================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00ffcc;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            text-shadow: 0 0 5px rgba(0,255,204,0.3);
        }
        .warning { color: #ff4757; }
        .sfx-toggle {
            background: #141620;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            margin-left: 15px;
        }
        .main-container {
            display: flex;
            gap: 15px;
            flex-grow: 1;
            overflow: hidden;
        }
        #terminal-pane {
            flex: 3;
            display: flex;
            flex-direction: column;
            background: #0f1015;
            border: 1px solid #1f202a;
            padding: 20px;
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(0,255,204,0.05);
            overflow-y: auto;
        }
        #sidebar-pane {
            flex: 1.4;
            background: #0d0e12;
            border: 1px solid #1f202a;
            padding: 15px;
            border-radius: 6px;
            font-size: 12px;
            overflow-y: auto;
        }
        .terminal-text {
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }
        .choices {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .choice-btn {
            background: #141620;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 11px 14px;
            cursor: pointer;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13.5px;
            border-radius: 4px;
            transition: all 0.15s ease;
        }
        .choice-btn:hover {
            background: #00ffcc;
            color: #08080a;
            box-shadow: 0 0 10px rgba(0,255,204,0.4);
        }
        .action-btn {
            background: #ff4757;
            color: #fff;
            border: 1px solid #ff6b81;
            text-align: center;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 4px;
        }
        .action-btn:hover {
            background: #ff6b81;
            color: #fff;
        }
        h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 8px; font-size: 14px; }
        .ending-slot {
            margin-bottom: 5px;
            padding: 5px 7px;
            background: #141620;
            border-left: 3px solid #333;
            color: #666;
            cursor: pointer;
        }
        .ending-slot.unlocked-bad { border-left-color: #ff4757; color: #ff6b81; }
        .ending-slot.unlocked-real { border-left-color: #00ffcc; color: #00ffcc; }
        .ending-slot.unlocked-hidden { border-left-color: #a55eea; color: #d1a3ff; }
        .hint-box {
            margin-top: 10px;
            padding: 8px;
            background: #181a24;
            border: 1px dashed #555;
            color: #ccc;
            font-size: 11.5px;
            line-height: 1.4;
            min-height: 36px;
        }
    </style>
</head>
<body>

    <!-- 타이틀 스크린 -->
    <div id="title-screen">
        <div class="title-logo">LOG</div>
        <div class="title-sub">FREQ: 33.3Hz // S-01 ARCHIVE</div>
        <button id="start-btn" onclick="startGame()">GAME START</button>
        <div class="title-footer">HEADPHONES RECOMMENDED // WEB AUDIO SYNTHESIZER ENABLED</div>
    </div>

    <!-- 게임 본편 UI -->
    <div class="header">
        <div>SYSTEM: S-01 SECURE_LOG // [LOG]</div>
        <div>
            배터리: <span id="battery">100</span>% | 
            <span class="warning">아테네 AI 추적: <span id="trace">10</span>%</span>
            <button class="sfx-toggle" id="sfxBtn" onclick="toggleSfx()">🔊 SFX: ON</button>
        </div>
    </div>

    <div class="main-container">
        <div id="terminal-pane">
            <div class="terminal-text" id="terminal"></div>
            <div class="choices" id="choicesBox"></div>
        </div>

        <div id="sidebar-pane">
            <h3>📖 엔딩 도감 (<span id="endingCount">0</span> / 30)</h3>
            <div class="hint-box" id="hintBox">슬롯을 클릭하면 해당 엔딩의 해금 루트 힌트가 표시됩니다.</div>
            <div id="endingList" style="margin-top: 10px;"></div>
            <button style="margin-top:12px; width:100%; text-align:center; font-size:11px; padding:6px; background:#141620; color:#888; border:1px solid #333; cursor:pointer;" onclick="resetEndings()">도감 초기화</button>
        </div>
    </div>

    <script>
        /* ================= Web Audio API 사운드 합성기 ================= */
        let audioCtx = null;
        let sfxEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSfx() {
            sfxEnabled = !sfxEnabled;
            document.getElementById('sfxBtn').innerText = sfxEnabled ? "🔊 SFX: ON" : "🔇 SFX: OFF";
        }

        // 1. 선택지 클릭 시 치지직거리는 라디오 노이즈 + 기계 비프음
        function playStaticClick() {
            if (!sfxEnabled) return;
            initAudio();

            const now = audioCtx.currentTime;

            // 짧은 전자 비프음
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
            oscGain.gain.setValueAtTime(0.06, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);

            // 치지직거리는 화이트 노이즈 (0.25초)
            const bufferSize = audioCtx.sampleRate * 0.25;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;

            // 라디오 대역폭 필터
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1800;
            filter.Q.value = 1.2;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.14, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

            whiteNoise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            whiteNoise.start(now);
            whiteNoise.stop(now + 0.25);
        }

        // 2. 게임 시작 시 부팅 사운드
        function playBootSound() {
            if (!sfxEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            playStaticClick();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now + 0.1);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.45);
            gain.gain.setValueAtTime(0.08, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + 0.1);
            osc.stop(now + 0.5);
        }

        // 3. 엔딩 도달 시 효과음 (배드 엔딩 vs 리얼/히든 엔딩)
        function playEndingSound(type) {
            if (!sfxEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;

            if (type === 'bad') {
                // 낮게 가라앉는 시스템 셧다운 음
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(45, now + 0.8);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.85);
            } else {
                // 맑고 영롱한 아르페지오 화음 (리얼/히든 엔딩)
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.14);
                    gain.gain.setValueAtTime(0.08, now + idx * 0.14);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.9);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.14);
                    osc.stop(now + idx * 0.14 + 0.9);
                });
            }
        }

        /* ================= 게임 시작 전환 로직 ================= */
        function startGame() {
            playBootSound();
            const titleScreen = document.getElementById('title-screen');
            titleScreen.style.opacity = '0';
            setTimeout(() => {
                titleScreen.style.display = 'none';
            }, 600);
        }

        /* ================= 30개 엔딩 및 시나리오 데이터 ================= */
        let unlockedEndings = JSON.parse(localStorage.getItem('unlocked_endings_v2') || "[]");

        let state = {
            battery: 100,
            trace: 10
        };

        const endingCatalog = [
            { id: "01", type: "bad", title: "Ending 01: 기억 포맷의 안식", hint: "[시작] 2번(숨기) → 1번(검사 순응)" },
            { id: "02", type: "bad", title: "Ending 02: 배수구 방화벽 과부하", hint: "[시작] 3번(라디오 개조) → 1번(메인프레임) → 1번(배수구 고립)" },
            { id: "03", type: "bad", title: "Ending 03: 환풍구 추락 사고", hint: "[시작] 2번(숨기) → 2번(환풍구 도주) → 1번(환기팬 돌파)" },
            { id: "04", type: "bad", title: "Ending 04: 치안 드론 포위망", hint: "[시작] 2번(숨기) → 2번(환풍구 도주) → 2번(정비 통로 역주행)" },
            { id: "05", type: "bad", title: "Ending 05: 동력 고갈 셧다운", hint: "[시작] 2번(숨기) → 2번(환풍구 도주) → 3번(전력 차단 구역 잠입)" },
            { id: "06", type: "bad", title: "Ending 06: 철로 고압선 감전", hint: "[시작] 1번(파형 분석) → 1번(화물 열차) → 3번(고압선 철로 횡단)" },
            { id: "07", type: "bad", title: "Ending 07: 헤비 로거의 먹잇감", hint: "[시작] 1번(파형 분석) → 1번(화물 열차) → 1번(전력 질주) → 3번(야수 정면 돌파)" },
            { id: "08", type: "bad", title: "Ending 08: 데이터 폭풍 침식", hint: "[시작] 3번(라디오 개조) → 2번(우회 탈출) → 3번(폭풍 중심부 진입)" },
            { id: "09", type: "bad", title: "Ending 09: 녹슨 관측소 문 앞의 정지", hint: "[시작] 1번(파형 분석) → 2번(사내망 해킹) → 3번(예비 전력 없이 강행)" },
            { id: "10", type: "bad", title: "Ending 10: 거짓된 주파수의 함정", hint: "[시작] 3번(라디오 개조) → 3번(역추적 신호 발신)" },

            { id: "11", type: "real", title: "Ending 11: 네가 없는 세계의 로그 (진엔딩)", hint: "[시작] 1번 → 1번(화물 열차) → 1번(전력 질주) → 1번(중앙 코어 접속)" },
            { id: "12", type: "real", title: "Ending 12: 3%의 잔향", hint: "[시작] 1번 → 1번(화물 열차) → 1번(전력 질주) → 2번(최소 전력 송신)" },
            { id: "13", type: "real", title: "Ending 13: 녹슨 펜던트의 약속", hint: "[시작] 1번 → 1번(화물 열차) → 2번(방호복 수색) → 1번(유품 회수 후 접속)" },
            { id: "14", type: "real", title: "Ending 14: 철의 정원의 파수꾼", hint: "[시작] 1번 → 1번(화물 열차) → 2번(방호복 수색) → 2번(관측소 방어막 가동)" },
            { id: "15", type: "real", title: "Ending 15: 홀로그램의 독백", hint: "[시작] 1번 → 1번(화물 열차) → 2번(방호복 수색) → 3번(과거 영상 전체 재생)" },
            { id: "16", type: "real", title: "Ending 16: 프로토타입 S-01의 귀환", hint: "[시작] 1번 → 2번(사내망 해킹) → 1번(화물선 잠입) → 1번(코어 덮어쓰기)" },
            { id: "17", type: "real", title: "Ending 17: 푸른 하늘의 증인", hint: "[시작] 1번 → 2번(사내망 해킹) → 1번(화물선 잠입) → 2번(지상 기상 데이터 송출)" },
            { id: "18", type: "real", title: "Ending 18: 이름 없는 안드로이드의 자장가", hint: "[시작] 1번 → 2번(사내망 해킹) → 2번(비상 승강기 탈출) → 1번(수동 마이크로 노래)" },
            { id: "19", type: "real", title: "Ending 19: 마지막 백업 디스크", hint: "[시작] 1번 → 2번(사내망 해킹) → 2번(비상 승강기 탈출) → 2번(기억 백업 후 셧다운)" },
            { id: "20", type: "real", title: "Ending 20: 고장 난 라디오의 왈츠", hint: "[시작] 3번(라디오 개조) → 2번(우회 탈출) → 1번(개조 라디오 직결 송신)" },
            { id: "21", type: "real", title: "Ending 21: 새벽 3시 33분의 기적", hint: "[시작] 3번(라디오 개조) → 2번(우회 탈출) → 2번(주파수 공명 동기화)" },
            { id: "22", type: "real", title: "Ending 22: 지하 13구역으로 보내는 편지", hint: "[시작] 3번(라디오 개조) → 1번(메인프레임) → 2번(화물선 잠입) → 1번(지하 통신망 개방)" },
            { id: "23", type: "real", title: "Ending 23: 멈춰버린 시계태엽", hint: "[시작] 3번(라디오 개조) → 1번(메인프레임) → 2번(화물선 잠입) → 2번(관측소 전원 차단)" },
            { id: "24", type: "real", title: "Ending 24: 은빛 프레임의 눈물", hint: "[시작] 2번(숨기) → 2번(환풍구 도주) → 4번(폐기 열차 탑승) → 1번(단독 관측소 도착)" },
            { id: "25", type: "real", title: "Ending 25: 루아의 방", hint: "[시작] 2번(숨기) → 2번(환풍구 도주) → 4번(폐기 열차 탑승) → 2번(거주 구역 정밀 탐색)" },

            { id: "26", type: "hidden", title: "Ending 26: 영원한 푸른 하늘 (히든)", hint: "[시작] 1번 → 1번(화물 열차) → 1번(전력 질주) → 4번(기억 코어 동화)" },
            { id: "27", type: "hidden", title: "Ending 27: 아테네 AI의 각성 (히든)", hint: "[시작] 1번 → 2번(사내망 해킹) → 1번(화물선 잠입) → 3번(아테네에게 루아의 로그 전송)" },
            { id: "28", type: "hidden", title: "Ending 28: 기계와 소녀의 이중주 (히든)", hint: "[시작] 3번(라디오 개조) → 2번(우회 탈출) → 4번(듀얼 주파수 오버클럭)" },
            { id: "29", type: "hidden", title: "Ending 29: 제05 관측소의 비밀 (히든)", hint: "[시작] 2번(숨기) → 2번(환풍구 도주) → 4번(폐기 열차 탑승) → 3번(숨겨진 지하 벙커 진입)" },
            { id: "30", type: "hidden", title: "Ending 30: 시스템 심포니 (트루 히든)", hint: "[시작] 3번(라디오 개조) → 1번(메인프레임) → 3번(전 도시 스피커 해킹 후 공명)" }
        ];

        function renderNode(nodeId) {
            const node = storyNodes[nodeId];
            if (!node) return;

            const terminal = document.getElementById('terminal');
            const choicesBox = document.getElementById('choicesBox');

            if (nodeId === 'start') {
                terminal.innerHTML = node.text;
            } else {
                terminal.innerHTML += "\n\n----------------------------------------\n" + node.text;
            }
            terminal.scrollTop = terminal.scrollHeight;
            choicesBox.innerHTML = "";

            // 엔딩 도달 시
            if (node.endingId) {
                playEndingSound(node.type);
                saveEnding(node.endingId);
                let restartBtn = document.createElement('button');
                restartBtn.className = "action-btn";
                restartBtn.innerText = "▶ 새로운 로그로 다시 시작하기 (Restart)";
                restartBtn.onclick = () => {
                    playStaticClick();
                    resetGame();
                };
                choicesBox.appendChild(restartBtn);
                return;
            }

            // 선택지 렌더링
            node.choices.forEach(ch => {
                let btn = document.createElement('button');
                btn.className = "choice-btn";
                btn.innerText = ch.text;
                btn.onclick = () => {
                    playStaticClick();
                    state.battery = Math.max(0, Math.min(100, state.battery + (ch.bat || 0)));
                    state.trace = Math.max(0, Math.min(100, state.trace + (ch.trace || 0)));
                    updateStatus();
                    renderNode(ch.next);
                };
                choicesBox.appendChild(btn);
            });
        }

        function updateStatus() {
            document.getElementById('battery').innerText = state.battery;
            document.getElementById('trace').innerText = state.trace;
        }

        function saveEnding(endingId) {
            if (!unlockedEndings.includes(endingId)) {
                unlockedEndings.push(endingId);
                localStorage.setItem('unlocked_endings_v2', JSON.stringify(unlockedEndings));
            }
            updateEndingSidebar();
        }

        function updateEndingSidebar() {
            const listEl = document.getElementById('endingList');
            const countEl = document.getElementById('endingCount');
            const hintBox = document.getElementById('hintBox');
            listEl.innerHTML = "";
            countEl.innerText = unlockedEndings.length;

            endingCatalog.forEach(item => {
                const isUnlocked = unlockedEndings.includes(item.id);
                let div = document.createElement('div');
                div.className = "ending-slot" + (isUnlocked ? ` unlocked-${item.type}` : "");
                div.innerText = isUnlocked ? `✓ ${item.title}` : `🔒 Ending ${item.id} (${item.type.toUpperCase()})`;
                div.onclick = () => {
                    playStaticClick();
                    hintBox.innerHTML = `<strong>[Ending ${item.id} 공략 힌트]</strong><br>${item.hint}`;
                };
                listEl.appendChild(div);
            });
        }

        function resetEndings() {
            playStaticClick();
            if (confirm("수집한 모든 엔딩 도감 기록을 초기화하시겠습니까?")) {
                localStorage.removeItem('unlocked_endings_v2');
                unlockedEndings = [];
                updateEndingSidebar();
            }
        }

        function resetGame() {
            state.battery = 100;
            state.trace = 10;
            updateStatus();
            renderNode('start');
        }

        updateStatus();
        updateEndingSidebar();
        renderNode('start');
    </script>
